name: Build and publish latest release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: latest-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2

      - name: Build and test
        run: ./gradlew clean build --no-daemon --console=plain

      - name: Prepare release JAR
        id: release
        shell: bash
        run: |
          version="$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r' | xargs)"
          jar_path="build/libs/AdvancedSoundAddon-${version}.jar"

          if [[ -z "$version" ]]; then
            echo "mod_version is missing from gradle.properties." >&2
            exit 1
          fi

          if [[ ! -f "$jar_path" ]]; then
            echo "Expected release JAR not found: $jar_path" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "jar_path=$jar_path" >> "$GITHUB_OUTPUT"
          echo "asset_name=AdvancedSoundAddon-${version}.jar" >> "$GITHUB_OUTPUT"

      - name: Create immutable version tag
        shell: bash
        run: |
          tag="${{ steps.release.outputs.tag }}"
          git fetch --force --tags origin

          if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
            tagged_commit="$(git rev-list -n 1 "$tag")"
            if [[ "$tagged_commit" != "$GITHUB_SHA" ]]; then
              echo "$tag already points to $tagged_commit." >&2
              echo "Increase mod_version before publishing another release." >&2
              exit 1
            fi
          else
            git tag "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
          fi

      - name: Publish versioned release
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = '${{ steps.release.outputs.jar_path }}';
            const assetName = '${{ steps.release.outputs.asset_name }}';
            const version = '${{ steps.release.outputs.version }}';
            const tagName = '${{ steps.release.outputs.tag }}';
            const { owner, repo } = context.repo;

            const releaseData = {
              owner,
              repo,
              tag_name: tagName,
              target_commitish: context.sha,
              name: `AdvancedSoundAddon ${version}`,
              body: `Automated build of commit ${context.sha}.`,
              draft: false,
              prerelease: false,
              make_latest: 'true'
            };

            let release;
            try {
              const existing = await github.rest.repos.getReleaseByTag({
                owner,
                repo,
                tag: tagName
              });
              const updated = await github.rest.repos.updateRelease({
                ...releaseData,
                release_id: existing.data.id
              });
              release = updated.data;
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
              const created = await github.rest.repos.createRelease(releaseData);
              release = created.data;
            }

            for (const asset of release.assets.filter(asset => asset.name === assetName)) {
              await github.rest.repos.deleteReleaseAsset({
                owner,
                repo,
                asset_id: asset.id
              });
            }

            const data = fs.readFileSync(path);
            await github.rest.repos.uploadReleaseAsset({
              owner,
              repo,
              release_id: release.id,
              name: assetName,
              headers: {
                'content-type': 'application/java-archive',
                'content-length': data.length
              },
              data
            });
